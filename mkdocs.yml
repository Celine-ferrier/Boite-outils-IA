site_name: Boîte à outils IA
site_description: Outils d'intelligence artificielle et tutoriels pour les enseignants d'IMT Mines Alès
copyright: IMT Mines Alès — Accompagnement pédagogique

theme:
  name: material
  language: fr
  font:
    text: Atkinson Hyperlegible
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Passer en mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Passer en mode clair
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang: fr

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

nav:
  - Accueil: index.md
  - Assistants conversationnels:
      - assistants/index.md
      - ILaaS: assistants/ilaas.md
      - Le Chat (Mistral): assistants/le-chat.md
      - Claude: assistants/claude.md
      - ChatGPT: assistants/chatgpt.md
      - Gemini: assistants/gemini.md
  - Création de contenu:
      - creation/index.md
      - Gamma: creation/gamma.md
      - Microsoft Designer: creation/microsoft-designer.md
      - Wooclap: creation/wooclap.md
      - Napkin: creation/napkin.md
      - HeyGen: creation/heygen.md
  - Recherche documentaire:
      - recherche/index.md
      - NotebookLM: recherche/notebooklm.md
      - Perplexity: recherche/perplexity.md
      - Semantic Scholar: recherche/semantic-scholar.md
      - ResearchRabbit: recherche/researchrabbit.md
  - Traduction:
      - traduction/index.md
      - DeepL: traduction/deepl.md
      - Traduire avec un assistant IA: traduction/assistant-ia.md
      - Sous-titres en direct PowerPoint: traduction/sous-titres-powerpoint.md
  - Bonnes pratiques: bonnes-pratiques.md
